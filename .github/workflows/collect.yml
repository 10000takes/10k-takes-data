name: Collect follower counts

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect YouTube subscribers
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python collect_youtube.py

      - name: Save results
        run: |
          git config user.name "follower-bot"
          git config user.email "follower-bot@users.noreply.github.com"
          git add followers.csv
          git diff --staged --quiet || git commit -m "Follower snapshot $(date -u +%F)"
          git push
