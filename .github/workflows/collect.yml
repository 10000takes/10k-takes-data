name: Collect follower counts
 
on:
  schedule:
    - cron: "0 11 * * *"   # every day at 11:00 UTC (6 AM Central during daylight time)
  workflow_dispatch:        # lets you run it by hand from the Actions tab
 
permissions:
  contents: write
  pages: write           # needed to save followers.csv back to the repo
 
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      - name: Collect YouTube subscribers
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python collect_youtube.py
 
      - name: Collect Facebook followers (main Page)
        continue-on-error: true
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
        run: python collect_facebook.py
 
      - name: Collect Instagram followers (main account)
        continue-on-error: true
        env:
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
        run: python collect_instagram.py
 
      - name: Collect X/Twitter followers (all accounts)
        continue-on-error: true
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python collect_x.py
 
      - name: Collect TikTok followers
        continue-on-error: true
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN_10K_TAKES: ${{ secrets.TIKTOK_REFRESH_TOKEN_10K_TAKES }}
        run: python collect_tiktok.py
 
      - name: Collect Threads followers
        continue-on-error: true
        env:
          THREADS_ACCESS_TOKEN_10K_TAKES: ${{ secrets.THREADS_ACCESS_TOKEN_10K_TAKES }}
        run: python collect_threads.py
 
      - name: Save results
        if: always()
        run: |
          git config user.name "follower-bot"
          git config user.email "follower-bot@users.noreply.github.com"
          git add followers.csv
          git diff --staged --quiet || git commit -m "Follower snapshot $(date -u +%F)"
          git push
 
      - name: Refresh the dashboard site
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
