name: Collect X data (weekly, Fridays 6 AM Central)
 
on:
  schedule:
    # GitHub schedules run in UTC. Two entries cover Central daylight time (UTC-5)
    # and standard time (UTC-6). The first step below lets only the one that
    # lands on 6 AM Central actually run.
    - cron: "7 11 * * 5"
    - cron: "7 12 * * 5"
  workflow_dispatch:        # lets you run it by hand from the Actions tab
 
permissions:
  contents: write
  pages: write
 
concurrency:
  group: collect-data
  cancel-in-progress: false
 
jobs:
  collect-x:
    runs-on: ubuntu-latest
    steps:
      - name: Check it is Friday 6 AM Central
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(TZ=America/Chicago date +%H)" = "06" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Not 6 AM Central right now, so this run is skipped."
          fi
 
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
 
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
 
      - name: Collect X/Twitter followers (all accounts)
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python collect_x.py
 
      - name: Collect X/Twitter views and engagement (all accounts)
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python collect_x_metrics.py
 
      - name: Save results
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "follower-bot"
          git config user.email "follower-bot@users.noreply.github.com"
          git add followers.csv
          [ -f metrics.csv ] && git add metrics.csv || true
          git diff --staged --quiet || git commit -m "X snapshot $(date -u +%F)"
          git pull --rebase --autostash
          git push
 
      - name: Refresh the dashboard site
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
